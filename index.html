<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noite de Jogos</title>
<meta name="description" content="Sete jogos de conversa para grupos de amigos, cada pessoa no próprio celular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a yellow poster ground. The row of ink tiles is the one loud element; everything around it is quiet type set straight on the ground. Single theme by choice. */
  --sun:#FFCF1A;
  --sun-deep:#E9B600;
  --ink:#17140C;
  --paper:#FFF9E6;
  --hot:#C8201C;
  --go:#14804A;
  --display:'Anton','Arial Narrow',Impact,sans-serif;
  --body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--sun);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
h1,h2,h3,p{margin:0}
h1,h2{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.95;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}

.btn{
  font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;
  font-size:1.15rem;line-height:1;
  padding:.8em 1.2em;
  border:3px solid var(--ink);border-radius:4px;
  background:var(--ink);color:var(--sun);
  text-decoration:none;display:inline-block;
  transition:transform .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.big{font-size:1.5rem;padding:.75em 1.4em}
.link{
  background:none;border:0;padding:4px 0;
  font-weight:600;font-size:.95rem;
  text-decoration:underline;text-underline-offset:3px;
}
.link.armed{color:var(--hot)}

.banner{
  background:var(--hot);color:#fff;font-weight:700;
  padding:10px 14px;border-radius:4px;margin-bottom:18px;
}

/* Tiles: the signature element */
.board{
  display:flex;flex-wrap:wrap;align-items:stretch;gap:.32em;
  font-size:clamp(1.35rem,3.3vw,2.7rem);
}
.tile{
  font-family:var(--display);font-size:1em;text-transform:uppercase;line-height:1;
  min-width:3.6em;height:2.5em;padding:0 .5em;
  display:flex;align-items:center;justify-content:center;position:relative;
  border:3px solid var(--ink);border-radius:4px;
  background:var(--ink);color:var(--sun);
}
button.tile{transition:transform .12s ease, background .12s ease}
button.tile:hover{transform:translateY(-4px);background:var(--hot);border-color:var(--hot);color:#fff}
.tile.locked{cursor:default}
.tile.open{background:var(--paper);color:var(--ink);letter-spacing:.01em}
.tile.open .n{
  position:absolute;top:.28em;left:.4em;
  font-family:var(--body);font-weight:700;font-size:.3em;letter-spacing:0;opacity:.55;
}
.tile.just{animation:flip .42s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:rotateX(88deg)}to{transform:rotateX(0)}}
.qmark{font-family:var(--display);font-size:1.9em;line-height:1;align-self:center;padding-left:.08em}

/* Home and setup */
.setup{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:start}
.hero{display:flex;flex-direction:column;gap:26px}
.hero h1{font-size:clamp(3.4rem,9vw,7rem);letter-spacing:-.005em}
.lede{font-size:1.2rem;font-weight:500;max-width:34em}
.sample{display:flex;flex-direction:column;gap:8px}
.sample .board{font-size:clamp(1rem,2vw,1.5rem)}
.sample small{font-weight:600;font-size:.85rem}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:r;max-width:36em}
.rules li{counter-increment:r;display:grid;grid-template-columns:2.1em 1fr;gap:12px;align-items:start}
.rules li::before{
  content:counter(r);
  font-family:var(--display);font-size:1.25rem;line-height:1;
  background:var(--ink);color:var(--sun);
  height:1.7em;display:flex;align-items:center;justify-content:center;border-radius:4px;
}
.panel{
  background:var(--paper);border:3px solid var(--ink);border-radius:6px;
  padding:26px;display:flex;flex-direction:column;gap:24px;
}
.panel h2{font-size:1.9rem}
.panel hr{border:0;border-top:2px solid var(--ink);margin:0;width:100%}
.field{display:flex;flex-direction:column;gap:10px}
.field > .lab{font-weight:700;font-size:.95rem}
.hint{font-size:.88rem;opacity:.8}
.names{display:flex;flex-direction:column;gap:8px}
.name-row{display:flex;gap:8px;flex-wrap:wrap}
.text{
  flex:1 1 9em;min-width:0;
  padding:.6em .75em;
  border:2px solid var(--ink);border-radius:4px;background:#fff;font-weight:600;
}
.text.code{font-family:var(--display);font-size:1.3rem;letter-spacing:.12em;text-transform:uppercase;flex:0 1 7.5em}
.icon{width:2.7em;flex:none;border:2px solid var(--ink);border-radius:4px;background:transparent;font-weight:700;font-size:1rem}
.icon:hover{background:var(--ink);color:var(--paper)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:.45em .85em;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:600;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.error{color:var(--hot);font-weight:700}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.lobby-main{display:flex;flex-direction:column;gap:22px}
.lobby h1{font-size:clamp(2.6rem,7vw,5rem)}
.lobby h1 span{display:block;font-size:.34em;letter-spacing:.05em;margin-bottom:.35em}
.share{display:flex;flex-direction:column;gap:10px}
.share .row{display:flex;gap:10px;flex-wrap:wrap}

/* Game */
.game{display:flex;flex-direction:column;gap:28px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:14px}
.bar .where{display:flex;flex-direction:column;gap:2px}
.bar .round{font-family:var(--display);text-transform:uppercase;font-size:1.7rem;line-height:1}
.bar .cat{font-weight:600}
.value{display:flex;align-items:baseline;gap:10px}
.value .num{font-family:var(--display);font-size:3.4rem;line-height:.85;font-variant-numeric:tabular-nums}
.value .lab{font-weight:700;max-width:7em;line-height:1.1}
.lower{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px;align-items:start}
.turn{
  background:var(--paper);border:3px solid var(--ink);border-radius:6px;
  padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-height:13.5em;
}
.turn.mine{box-shadow:0 0 0 5px var(--hot)}
.turn-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{font-family:var(--display);text-transform:uppercase;font-size:2rem;line-height:1;overflow-wrap:anywhere}
.clock{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums;padding:.3em .5em;border:3px solid var(--ink);border-radius:4px}
.clock.low{background:var(--hot);border-color:var(--hot);color:#fff}
.do{font-size:1.12rem;font-weight:500}
.note{font-weight:700;color:var(--hot)}
.guess{display:flex;gap:10px;flex-wrap:wrap}
.guess input{flex:1 1 14em;min-width:0;padding:.65em .8em;border:3px solid var(--ink);border-radius:4px;background:#fff;font-size:1.2rem;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{font-family:var(--display);text-transform:uppercase;font-size:1.75rem;line-height:1.05;overflow-wrap:anywhere}
.verdict.good{color:var(--go)}
.verdict.bad{color:var(--hot)}
.answer{font-size:1.2rem}

.scores{display:flex;flex-direction:column;gap:10px}
.scores h2{font-size:1.25rem;letter-spacing:.03em}
.scores ol{list-style:none;margin:0;padding:0;border-top:3px solid var(--ink)}
.scores li{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:9px 10px 9px 12px;border-bottom:2px solid var(--ink);border-left:8px solid transparent;
}
.scores li.now{border-left-color:var(--hot);background:var(--sun-deep)}
.scores li.off .nm{opacity:.6}
.scores .nm{font-weight:700;overflow-wrap:anywhere}
.scores .nm small{display:block;font-weight:600;font-size:.78rem}
.scores li.now .nm small.turnmark{color:var(--hot)}
.scores .pt{font-family:var(--display);font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.quiet{display:flex;gap:24px;flex-wrap:wrap}

/* End */
.end{display:flex;flex-direction:column;gap:30px;max-width:760px}
.end h1{font-size:clamp(2.8rem,8vw,5.6rem);overflow-wrap:anywhere}
.end .sub{font-size:1.2rem;font-weight:600}
.rank{list-style:none;margin:0;padding:0;border-top:3px solid var(--ink)}
.rank li{display:grid;grid-template-columns:2.4em 1fr auto;gap:14px;align-items:center;padding:12px 6px;border-bottom:2px solid var(--ink)}
.rank .pos{font-family:var(--display);font-size:1.6rem;line-height:1}
.rank .nm{font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.rank .pt{font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.rank li.top{background:var(--ink);color:var(--sun);border-radius:4px;padding-left:14px;padding-right:14px}

.wait{display:flex;flex-direction:column;gap:18px;max-width:640px}
.wait h1{font-size:clamp(2.4rem,7vw,4.4rem)}

@media (max-width:860px){
  .setup,.lower,.lobby{grid-template-columns:minmax(0,1fr);gap:28px}
  #app{padding:20px 16px 32px}
  .tile{min-width:3em}
  .turn{min-height:0}
}
@media (prefers-reduced-motion:reduce){
  .tile.just{animation:none}
  .btn,button.tile{transition:none}
}

/* ---- Noite de Jogos additions ---- */
h3{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:1.3rem;line-height:1}
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:3px solid var(--ink);max-width:36em}
.menu li{display:grid;grid-template-columns:minmax(0,11.5em) 1fr;gap:14px;padding:10px 2px;border-bottom:2px solid var(--ink);align-items:baseline}
.menu strong{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:1.2rem;line-height:1.05}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.pick{font-family:var(--display);text-transform:uppercase;font-size:1.05rem;line-height:1;padding:.6em .8em;border:3px solid var(--ink);border-radius:4px;background:transparent}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--sun)}
.about{display:flex;flex-direction:column;gap:10px}
.how{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.value-row,.counter{display:flex;align-items:baseline;gap:10px}
.value-row .num,.counter .num{font-family:var(--display);font-size:3.4rem;line-height:.85;font-variant-numeric:tabular-nums}
.value-row .lab,.counter .lab{font-weight:700}
.theme{display:flex;flex-direction:column;gap:6px}
.theme .lab{font-weight:700;font-size:.9rem;text-transform:uppercase;letter-spacing:.07em}
.theme .big{font-family:var(--display);text-transform:uppercase;font-size:clamp(2rem,5.2vw,3.6rem);line-height:.98;text-wrap:balance;overflow-wrap:anywhere}
.btn.hotbtn{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.armed{background:var(--go);border-color:var(--go);color:#fff}
.taboo{background:var(--ink);color:var(--sun);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.taboo .word{font-family:var(--display);text-transform:uppercase;font-size:clamp(2.2rem,6vw,3.4rem);line-height:.95}
.taboo .lab{font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:#fff}
.taboo ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.taboo li{border:2px solid var(--sun);border-radius:999px;padding:.2em .7em;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.pad .btn{padding:.7em 0;font-size:1.3rem}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slots li{display:grid;grid-template-columns:2.4em 1fr auto;gap:12px;align-items:center;background:var(--ink);color:var(--sun);border:3px solid var(--ink);border-radius:4px;padding:8px 12px}
.slots li.open{background:var(--paper);color:var(--ink)}
.slots .rk{font-family:var(--display);font-size:1.4rem;line-height:1}
.slots .an{font-family:var(--display);text-transform:uppercase;font-size:1.5rem;line-height:1;overflow-wrap:anywhere}
.slots .by{font-weight:600;font-size:.85rem}
.maincol{display:flex;flex-direction:column;gap:24px;min-width:0}
.maincol .quiet{margin-top:-6px}
.game .turn{min-height:0}
.result{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:1.08rem}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:6px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;min-height:9.6em}
.card .pn{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.07em}
.card .idn{font-family:var(--display);text-transform:uppercase;font-size:clamp(1.7rem,3vw,2.3rem);line-height:1;overflow-wrap:anywhere}
.card .ds{font-size:.92rem}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.tag{font-size:.76rem;font-weight:700;padding:.15em .6em;border:2px solid currentColor;border-radius:999px}
.tag.hot{background:var(--hot);border-color:var(--hot);color:#fff}
.tag.go{background:var(--go);border-color:var(--go);color:#fff}
.card.secret{background:var(--ink);color:var(--sun)}
.card.secret .idn.q{font-size:4.6rem;line-height:.85}
.card.now{box-shadow:0 0 0 5px var(--hot)}
@media (max-width:860px){ .menu li{grid-template-columns:minmax(0,1fr);gap:2px} .pad{grid-template-columns:repeat(4,minmax(0,1fr))} }
</style>
</head>

/* ---------- Helpers shared with the games ---------- */
function norm(s){
  var t = String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  t = t.replace(/[^a-z0-9]+/g,' ').trim();
  var again = true;
  while(again){
    var m = t.replace(/^(o|a|os|as|um|uma|the) /,'');
    again = m !== t; t = m;
  }
  return t;
}
function lev(a,b){
  var m=a.length,n=b.length,i,j,prev=[],cur;
  for(j=0;j<=n;j++)prev[j]=j;
  for(i=1;i<=m;i++){
    cur=[i];
    for(j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[n];
}
function isCorrect(guess, accepted){
  var g = norm(guess);
  if(!g) return false;
  for(var i=0;i<accepted.length;i++){
    var a = norm(accepted[i]);
    if(g===a) return true;
    if(/[0-9]/.test(a) || a.length<5) continue;
    if(lev(g,a) <= (a.length>=10 ? 2 : 1)) return true;
  }
  return false;
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;
  }
  return arr;
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function pts(n){ n = Number(n)||0; return n===1 ? '1 ponto' : n+' pontos'; }
function rid(n){
  var a='abcdefghijklmnopqrstuvwxyz0123456789', s='';
  for(var i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s;
}
function cleanName(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().slice(0,18); }
function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }

/* Picks n items out of a bank, avoiding the ones this device already used in earlier games. */
function pickQueue(key, total, n, filter){
  var used = load('nj-used-'+key); if(!Array.isArray(used)) used = [];
  var all = [];
  for(var i=0;i<total;i++) if(!filter || filter(i)) all.push(i);
  var pool = all.filter(function(i){ return used.indexOf(i)<0; });
  if(pool.length < Math.min(n, all.length)){
    used = used.filter(function(i){ return all.indexOf(i)<0; });
    pool = all.slice();
  }
  var q = shuffle(pool).slice(0, n);
  store('nj-used-'+key, used.concat(q));
  return q;
}
function nameOf(S,pid){
  for(var i=0;i<S.players.length;i++) if(S.players[i].pid===pid) return S.players[i].name;
  return '';
}
function orderOf(S){ return S.players.map(function(p){ return p.pid; }); }
function addScore(G,pid,n){ G.score[pid] = Math.max(0, (G.score[pid]||0) + n); }
/* Removes a player from a turn order and keeps the turn index on the same person. */
function dropFromOrder(G,pid){
  var i = G.order.indexOf(pid);
  if(i<0) return;
  var cur = G.order[G.ti];
  G.order.splice(i,1);
  var k = G.order.indexOf(cur);
  G.ti = k>=0 ? k : (G.order.length ? i % G.order.length : 0);
}

function clockText(t){
  t = Math.max(0, Number(t)||0);
  return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
}

/* ---------- Room state. S lives only on the device that created the room. ---------- */
function defaultsFor(id){
  var M = GAMES[id], su = {};
  (M.opts||[]).forEach(function(o){ su[o.k] = o.def; });
  if(M.cats){ su.cats = {}; Object.keys(M.cats).forEach(function(k){ su.cats[k] = true; }); }
  return su;
}
function newRoom(hostPid, name){
  var S = {status:'lobby', hostPid:hostPid, players:[{pid:hostPid, name:name, wins:0}], sel:GAME_ORDER[0], settings:{}, game:null, G:null, seq:0};
  GAME_ORDER.forEach(function(id){ S.settings[id] = defaultsFor(id); });
  return S;
}
function applyRoom(S, from, it, host){
  if(!it || typeof it!=='object') return false;
  var M;
  switch(it.t){
    case 'sel':
      if(!host || S.status!=='lobby' || !GAMES[it.id]) return false;
      S.sel = it.id; return true;
    case 'opt':
      if(!host || S.status!=='lobby') return false;
      M = GAMES[S.sel];
      var o = (M.opts||[]).filter(function(x){ return x.k===it.k; })[0];
      if(!o || !o.vals.some(function(v){ return v[0]===it.v; })) return false;
      S.settings[S.sel][it.k] = it.v; return true;
    case 'cat':
      if(!host || S.status!=='lobby') return false;
      M = GAMES[S.sel];
      if(!M.cats || !M.cats[it.k]) return false;
      S.settings[S.sel].cats[it.k] = !S.settings[S.sel].cats[it.k]; return true;
    case 'start':
      if(!host) return false;
      if(S.status==='play' && !(S.G && S.G.over)) return false;
      M = GAMES[S.sel];
      if(S.players.length < M.min) return false;
      var G = M.start(S, S.settings[S.sel]);
      if(!G) return false;
      G.score = {};
      G.order.forEach(function(pid){ G.score[pid] = 0; });
      S.game = S.sel; S.G = G; S.status = 'play';
      return true;
    case 'back':
      if(!host || S.status!=='play') return false;
      S.status = 'lobby'; S.G = null; S.game = null;
      return true;
    case 'remove':
      if(!host || it.pid===S.hostPid) return false;
      if(!S.players.some(function(p){ return p.pid===it.pid; })) return false;
      if(S.status==='play' && S.G && S.G.order.indexOf(it.pid)>=0){
        M = GAMES[S.game];
        if(M.drop) M.drop(S.G, S, it.pid);
        if(!S.G.order.length) S.G.over = true;
      }
      S.players = S.players.filter(function(p){ return p.pid!==it.pid; });
      return true;
  }
  if(S.status!=='play' || !S.G || S.G.over) return false;
  M = GAMES[S.game];
  if(!(M.free && M.free[it.t]) && it.seq!==S.seq) return false;
  if(S.G.order.indexOf(from)<0) return false;
  return !!M.apply(S.G, S, from, it, host);
}
/* When a game ends, whoever has the most points takes one win for the night. */
function settle(S){
  var G = S.G;
  if(!G || !G.over || G.counted) return;
  G.counted = true;
  var best = 0;
  G.order.forEach(function(pid){ best = Math.max(best, G.score[pid]||0); });
  if(best<=0) return;
  S.players.forEach(function(p){ if(G.order.indexOf(p.pid)>=0 && (G.score[p.pid]||0)===best) p.wins = (p.wins||0)+1; });
}
function viewOf(S, code){
  var V = {code:code||'', ts:Date.now(), seq:S.seq, status:S.status, hostPid:S.hostPid, sel:S.sel,
    settings:S.settings[S.sel],
    players:S.players.map(function(p){ return {pid:p.pid, name:p.name, wins:p.wins||0, on:isOn(p.pid)}; })};
  if(S.status==='play' && S.G){
    V.game = S.game;
    V.g = GAMES[S.game].view(S.G, S) || {};
    V.g.score = S.G.score; V.g.order = S.G.order; V.g.over = !!S.G.over;
  }
  return V;
}
function privOf(S, pid){
  var M = S.status==='play' && S.G ? GAMES[S.game] : null;
  return {s:S.seq, g: M && M.priv ? M.priv(S.G, S, pid) : null};
}

function makeCode(bi){
  var a='ABCDEFGHJKLMNPQRSTUVWXYZ', s='';
  for(var i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s + (bi+1);
}
function parseCode(raw){
  var c = String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!/^[A-Z]{4}[1-9]$/.test(c)) return null;
  var bi = devBroker ? 0 : (+c[4]-1);
  if(bi>=BROKERS.length) return null;
  return {code:c, bi:bi};
}

}

  try{

      wake = w; w.addEventListener('release', function(){ wake = null; });

  }catch(e){}
}

  settle(app.S);
  store('nj-host', {code:app.code, bi:app.bi, name:app.name, S:app.S, toks:toks, at:Date.now()});
  app.V = viewOf(app.S, app.code);
  app.P = privOf(app.S, app.me);
  render();
  publishAll();
}
function publishState(){
  if(!net.client || app.mode!=='host') return;
  try{ net.client.publish(net.base+'/s', JSON.stringify({v:viewOf(app.S, app.code)}), {qos:1, retain:true}); }catch(e){}
}
function publishPrivate(pid){
  if(!net.client || app.mode!=='host' || !toks[pid]) return;
  try{ net.client.publish(net.base+'/u/'+toks[pid], JSON.stringify({p:privOf(app.S, pid)}), {qos:1, retain:true}); }catch(e){}
}
function publishAll(){
  publishState();
  app.S.players.forEach(function(p){ if(p.pid!==app.me) publishPrivate(p.pid); });
}
function act(it){
  if(app.mode==='guest') return sendIntent(it);
  it.seq = app.S.seq;
  if(applyRoom(app.S, app.me, it, true)){ app.S.seq++; commit(); } else render();
}
function createRoom(){
  var name = cleanName(app.name);
  if(!name){ app.error='Escreva o seu nome para criar a sala.'; return render(); }
  app.name = name; store('nj-name', name);
  ensureIdentity();
  app.error=''; app.screen='connecting'; app.msg='Criando a sala.';
  render();
  tryCreate(0, 0, gen);
}
function tryCreate(bi, attempt, g){
  if(g!==gen || app.screen!=='connecting') return;
  if(bi>=BROKERS.length) return goHome('Não consegui conectar ao servidor do jogo. Confira a internet e tente de novo.');
  var code = makeCode(bi), base = topicBase(code);
  var c = connect(bi), settled = false;
  net.client = c;
  var giveUp = setTimeout(function(){ if(!settled){ settled=true; try{ c.end(true); }catch(e){} tryCreate(bi+1, 0, g); } }, 9000);
  c.on('error', function(){});
  c.on('connect', function(){
    if(settled || g!==gen) return;
    settled = true; clearTimeout(giveUp);
    var taken = false;
    var probe = function(t,p){
      if(t!==base+'/s') return;
      try{
        var m = JSON.parse(p.toString());
        if(m && m.v && m.v.hostPid!==app.me && Date.now()-m.v.ts < 2*3600e3) taken = true;
      }catch(e){}
    };
    c.on('message', probe);
    c.subscribe(base+'/s');
    setTimeout(function(){
      c.removeListener('message', probe);
      c.unsubscribe(base+'/s');
      if(g!==gen || net.client!==c) return;
      if(taken && attempt<3){ try{ c.end(true); }catch(e){} return tryCreate(bi, attempt+1, g); }
      becomeHost(c, code, bi, null, null);
    }, 900);
  });
}
function resumeHost(saved){
  ensureIdentity();
  app.name = saved.name || app.name;
  app.error=''; app.screen='connecting'; app.msg='Reabrindo a sala '+saved.code+'.';
  render();
  var c = connect(saved.bi), settled = false, g = gen;
  net.client = c;
  var giveUp = setTimeout(function(){ if(!settled && g===gen){ settled=true; goHome('Não consegui reabrir a sala. Confira a internet e tente de novo.'); } }, 12000);
  c.on('error', function(){});
  c.on('connect', function(){
    if(settled || g!==gen || net.client!==c) return;
    settled = true; clearTimeout(giveUp);
    becomeHost(c, saved.code, saved.bi, saved.S, saved.toks);
  });
}
function becomeHost(c, code, bi, S, savedToks){
  app.mode='host'; app.code=code; app.bi=bi; app.conn='ok';
  app.S = S || newRoom(app.me, app.name);
  net.base = topicBase(code);
  seen = {}; online = {}; toks = (savedToks && typeof savedToks==='object') ? savedToks : {};
  var now = Date.now();
  app.S.players.forEach(function(p){ seen[p.pid] = now; });
  c.subscribe(net.base+'/i', {qos:1});
  c.on('message', hostMessage);
  c.on('connect', function(){ if(net.client!==c) return; app.conn='ok'; publishAll(); render(); });
  c.on('close', function(){ if(net.client!==c) return; app.conn='lost'; render(); });
  app.screen='room';
  setHash(code);
  every(4000, function(){
    var changed = false, t = Date.now();
    app.S.players.forEach(function(p){
      if(p.pid===app.me) return;
      var on = t - (seen[p.pid]||0) < 20000;
      if((online[p.pid]!==false) !== on){ online[p.pid] = on; changed = true; }
    });
    if(changed){ app.V = viewOf(app.S, app.code); render(); publishState(); }
  });
  /* One clock for every timed game: the host counts, everyone else follows. */
  every(1000, function(){
    var S = app.S;
    if(!S || S.status!=='play' || !S.G || S.G.over) return;
    var M = GAMES[S.game];
    if(!M.tick) return;
    var before = S.G.t;
    if(M.tick(S.G, S)){ S.seq++; return commit(); }
    if(S.G.t!==before){
      if(app.V && app.V.g) app.V.g.t = S.G.t;
      paintClock();
      if(S.G.t % 5 === 0) publishState();
    }
  });
  commit();
}
function hostMessage(topic, payload){
  if(topic!==net.base+'/i' || app.mode!=='host') return;
  var m;
  try{ m = JSON.parse(payload.toString()); }catch(e){ return; }
  if(!m || typeof m.pid!=='string' || m.pid.length<8 || m.pid.length>24 || m.pid===app.me) return;
  var S = app.S, known = S.players.some(function(p){ return p.pid===m.pid; });
  if(m.k==='j'){
    var name = cleanName(m.name) || 'Jogador';
    if(typeof m.tok!=='string' || !/^[a-z0-9]{16,32}$/.test(m.tok)) return;
    seen[m.pid] = Date.now();
    if(known){
      var changed = online[m.pid]===false || toks[m.pid]!==m.tok;
      online[m.pid] = true; toks[m.pid] = m.tok;
      S.players.forEach(function(p){ if(p.pid===m.pid && p.name!==name && S.status==='lobby'){ p.name = name; changed = true; } });
      if(changed) return commit();
      publishState(); return publishPrivate(m.pid);
    }
    if(S.players.length>=MAX_PLAYERS) return publishState();
    toks[m.pid] = m.tok;
    S.players.push({pid:m.pid, name:name, wins:0});
    online[m.pid] = true;
    return commit();
  }
  if(!known) return;
  seen[m.pid] = Date.now();
  if(m.k==='l'){ seen[m.pid] = 0; online[m.pid] = false; app.V = viewOf(S, app.code); render(); return publishState(); }
  if(m.k==='i'){
    var it = m.it || {};
    if(typeof it.t!=='string' || ['sel','opt','cat','start','back','remove'].indexOf(it.t)>=0) return;
    if(applyRoom(S, m.pid, it, false)){ S.seq++; commit(); }
  }
}
function closeRoom(){
  if(net.client){
    try{
      net.client.publish(net.base+'/s', JSON.stringify({closed:true}), {qos:1, retain:false});
      net.client.publish(net.base+'/s', '', {qos:1, retain:true});
      Object.keys(toks).forEach(function(pid){ net.client.publish(net.base+'/u/'+toks[pid], '', {qos:1, retain:true}); });
    }catch(e){}
  }
  store('nj-host', null);
  var c = net.client;
  setTimeout(function(){ if(c){ try{ c.end(); }catch(e){} } }, 700);
  net.client = null;
  goHome('');
}

/* ---------- Guest ---------- */
function joinRoom(rawCode){
  var name = cleanName(app.name);
  var pc = parseCode(rawCode);
  if(!name){ app.error='Escreva o seu nome para entrar na sala.'; return render(); }
  if(!pc){ app.error='O código da sala tem quatro letras e um número, como KQTM1.'; return render(); }
  app.name = name; store('nj-name', name);
  ensureIdentity();
  stopAll();
  app.mode='guest'; app.code=pc.code; app.bi=pc.bi; app.V=null; app.P=null; app.error=''; app.conn='ok';
  app.screen='connecting'; app.msg='Entrando na sala '+pc.code+'.';
  net.base = topicBase(pc.code);
  var c = connect(pc.bi);
  net.client = c;
  setHash(pc.code);
  render();
  var sendJoin = function(){ sendRaw({k:'j', pid:app.me, name:app.name, tok:app.tok}); };
  c.on('error', function(){});
  c.on('connect', function(){
    if(net.client!==c) return;
    app.conn='ok';
    c.subscribe(net.base+'/s', {qos:1});
    c.subscribe(net.base+'/u/'+app.tok, {qos:1});
    sendJoin();
    render();
  });
  c.on('close', function(){ if(net.client!==c) return; app.conn='lost'; render(); });
  c.on('message', guestMessage);
  every(2500, function(){ if(!isMember()) sendJoin(); retryIntent(); });
  every(8000, function(){ if(isMember()) sendRaw({k:'h', pid:app.me}); });
  every(1000, function(){
    var g = app.V && app.V.status==='play' ? app.V.g : null;
    if(!g || !g.timed || g.over) return;
    g.t = Math.max(0, (Number(g.t)||0)-1);
    paintClock();
  });
  var g = gen;
  setTimeout(function(){
    if(g!==gen || net.client!==c || isMember()) return;
    goHome(app.V
      ? 'A sala '+pc.code+' existe, mas quem a criou não respondeu. Peça para a pessoa abrir o jogo de novo.'
      : 'Não encontrei a sala '+pc.code+'. Confira o código com quem criou a sala.');
  }, 12000);
}
function isMember(){
  return !!(app.V && Array.isArray(app.V.players) && app.V.players.some(function(p){ return p.pid===app.me; }));
}
function sendRaw(m){
  if(!net.client) return;
  try{ net.client.publish(net.base+'/i', JSON.stringify(m), {qos:1}); }catch(e){}
}
function guestMessage(topic, payload){
  if(app.mode!=='guest') return;
  var m;
  try{ m = JSON.parse(payload.toString()); }catch(e){ return; }
  if(!m) return;
  if(topic===net.base+'/u/'+app.tok){
    if(m.p && typeof m.p==='object'){ app.P = m.p; render(); }
    return;
  }
  if(topic!==net.base+'/s') return;
  if(m.closed){ store('nj-guest', null); return goHome('A sala foi encerrada por quem a criou.'); }
  var V = m.v;
  if(!V || !Array.isArray(V.players) || !V.settings) return;
  var was = isMember();
  app.V = V;
  checkPending();
  if(isMember()){
    if(app.screen!=='room') app.msg = '';
    app.screen='room';
    store('nj-guest', {code:app.code, name:app.name, at:Date.now()});
  }else if(was){
    store('nj-guest', null);
    return goHome('Você foi removido da sala.');
  }else if(V.players.length>=MAX_PLAYERS){
    return goHome('A sala '+app.code+' já está cheia.');
  }
  render();
}
/* A guest keeps an intent pending until the room state shows it took effect. */
function intentDone(p){
  var V = app.V;
  if(!V) return true;
  if(p.free){
    if(V.status!=='play' || !V.g || V.game!==p.game) return true;
    var M = GAMES[V.game];
    return M.done ? !!M.done(V.g, app.me, p.it) : true;
  }
  return V.seq!==p.it.seq;
}
function checkPending(){ if(pendingIntent && intentDone(pendingIntent)) pendingIntent = null; }
function sendIntent(it){
  var V = app.V;
  if(!V) return;
  it.seq = V.seq;
  var M = V.status==='play' ? GAMES[V.game] : null;
  var free = !!(M && M.free && M.free[it.t]);
  sendRaw({k:'i', pid:app.me, it:it});
  if(!(free && M.noWait && M.noWait[it.t])) pendingIntent = {it:it, tries:0, free:free, game:V.game};
  render();
}
function retryIntent(){
  if(!pendingIntent) return;
  if(intentDone(pendingIntent)){ pendingIntent = null; return; }
  pendingIntent.tries++;
  if(pendingIntent.tries>4){ pendingIntent = null; app.msg = 'Sem resposta de quem criou a sala. Tente de novo em instantes.'; return render(); }
  sendRaw({k:'i', pid:app.me, it:pendingIntent.it});
}
function leaveRoom(){
  sendRaw({k:'l', pid:app.me});
  store('nj-guest', null);
  var c = net.client;
  net.client = null;
  setTimeout(function(){ if(c){ try{ c.end(); }catch(e){} } }, 400);
  goHome('');
}

  var el = document.getElementById('clock'), g = app.V && app.V.g;
  if(!el || !g) return;

  el.classList.toggle('low', g.t<=5);
}

function renderConnecting(){

function renderOver(V, g){

function renderPlay(V){
  var host = app.mode==='host';
  var M = GAMES[V.game], g = V.g || {};
  if(!M) return renderConnecting();
  var fresh = app.P && app.P.s===V.seq;
  var ctx = {
    me:app.me, host:host,
    playing:(g.order||[]).indexOf(app.me)>=0,
    pending:!!pendingIntent,
    name:function(pid){
      for(var i=0;i<V.players.length;i++) if(V.players[i].pid===pid) return V.players[i].name;
      return 'Alguém';
    }
  };
  var h = '<div class="game">';
  h += '<header class="bar"><div class="where"><span class="round">'+esc(M.name)+'</span>'
    + '<span class="cat">'+esc(g.over ? 'Partida encerrada' : (g.head||''))+'</span></div>';
  if(g.timed && !g.over) h += '<span id="clock" class="clock'+(g.t<=5?' low':'')+'" aria-label="Tempo restante">'+clockText(g.t)+'</span>';
  h += '</header>';
  h += '<div class="lower"><div class="maincol">';
  if(g.over) h += renderOver(V, g);
  else{
    h += M.render(g, fresh ? app.P.g : null, ctx);
    if(!ctx.playing) h += '<p class="hint">Você entrou com a partida em andamento. No próximo jogo você participa.</p>';
    if(ctx.pending) h += '<p class="hint">Enviando a sua jogada.</p>';
    else if(app.mode==='guest' && app.msg) h += '<p class="note">'+esc(app.msg)+'</p>';
  }
  h += '</div><aside class="scores"><h2>Placar da sala '+esc(V.code)+'</h2>'+playersHtml(V, g)+'</aside></div>';
  h += '<footer class="quiet">';
  if(host){
    if(!g.over) h += '<button type="button" class="link'+(app.armed==='back'?' armed':'')+'" data-act="back" data-arm="back">'+(app.armed==='back'?'Clique de novo para encerrar este jogo':'Encerrar este jogo e voltar para a sala')+'</button>';
  }else{
    h += '<button type="button" class="link'+(app.armed==='leave'?' armed':'')+'" data-act="leave">'+(app.armed==='leave'?'Clique de novo para sair da sala':'Sair da sala')+'</button>';
  }
  return h + '</footer></div>';

function render(){
  var root = document.getElementById('app');
  var sq = app.V ? app.V.seq : -1;
  var same = sq===lastSeq;
  if(!same){ app.armed = ''; lastSeq = sq; }
  var keep = {}, focusId = document.activeElement && document.activeElement.id;
  Array.prototype.forEach.call(root.querySelectorAll('input[id]'), function(el){ keep[el.id] = el.value; });
  var h = '';
  try{
    if(app.conn==='lost' && app.screen==='room') h += '<p class="banner" role="status">Sem conexão com o servidor do jogo. Estou tentando reconectar.</p>';
    if(app.screen==='home') h += renderHome();
    else if(app.screen==='connecting') h += renderConnecting();
    else if(app.V && app.V.status==='play' && app.V.g) h += renderPlay(app.V);
    else if(app.V) h += renderLobby(app.V);
  }catch(e){
    h = '<div class="wait"><h1>Algo deu errado</h1><p class="lede">Não consegui mostrar esta tela. Recarregue a página para voltar ao jogo.</p></div>';
    try{ console.error(e); }catch(_){}
  }
  root.innerHTML = h;
  /* Text someone is typing must survive a redraw caused by another player's move. */
  Object.keys(keep).forEach(function(id){
    var el = document.getElementById(id);
    if(el && !el.readOnly) el.value = keep[id];
  });
  var f = focusId ? document.getElementById(focusId) : null;
  if(!f && app.screen==='room') f = root.querySelector('[data-autofocus]');
  if(f && f.tagName==='INPUT') f.focus();
}

/* ---------- Events ---------- */
function armed(name){
  if(app.armed===name){ app.armed=''; return true; }
  app.armed = name; render(); return false;
}
function parseVal(v){ return /^-?\d+$/.test(v) ? Number(v) : v; }
document.addEventListener('click', function(e){
  var gb = e.target.closest('[data-g]');
  if(gb){
    if(app.screen==='room') keepAwake();
    if(app.mode==='guest') app.msg = '';
    var it;
    try{ it = JSON.parse(gb.dataset.g); }catch(err){ return; }
    if(gb.dataset.arm){ if(!armed(gb.dataset.arm)) return; }
    else app.armed = '';
    return act(it);
  }
  var b = e.target.closest('[data-act]');
  if(!b) return;
  var a = b.dataset.act;
  if(app.screen==='room') keepAwake();
  if(['back','close','leave'].indexOf(a)<0) app.armed = '';
  app.copied = false;
  if(app.mode==='guest') app.msg = '';
  switch(a){
    case 'home': goHome(''); break;
    case 'sel': app.error=''; act({t:'sel', id:b.dataset.id}); break;
    case 'opt': act({t:'opt', k:b.dataset.k, v:parseVal(b.dataset.v)}); break;
    case 'cat': app.error=''; act({t:'cat', k:b.dataset.k}); break;
    case 'create': createRoom(); break;
    case 'join': joinRoom((document.getElementById('room-code')||{}).value); break;
    case 'join-invite': joinRoom(app.invite); break;
    case 'drop-invite': app.invite=''; app.error=''; setHash(''); render(); break;
    case 'resume': var hs = load('nj-host'); if(hs) resumeHost(hs); break;
    case 'copy':
      var done = function(){ app.copied = true; render(); };
      var fallback = function(){ var el = document.getElementById('share-link'); if(el){ el.focus(); el.select(); } };
      try{ navigator.clipboard.writeText(roomLink()).then(done, fallback); }catch(err){ fallback(); }
      break;
    case 'start':
      if(app.mode!=='host') break;
      var M = GAMES[app.S.sel];
      if(app.S.players.length<M.min){ app.error='Este jogo precisa de pelo menos '+M.min+' jogadores na sala.'; return render(); }
      app.error='';
      var before = app.S.seq;
      act({t:'start'});
      if(app.S.seq===before){ app.error='Escolha pelo menos um tema para começar.'; render(); }
      break;
    case 'back': if(app.S && app.S.G && !app.S.G.over){ if(armed('back')) act({t:'back'}); } else act({t:'back'}); break;
    case 'remove': act({t:'remove', pid:b.dataset.pid}); break;
    case 'close': if(armed('close')) closeRoom(); break;
    case 'leave': if(app.V && app.V.status==='play'){ if(armed('leave')) leaveRoom(); } else leaveRoom(); break;
  }
});
document.addEventListener('submit', function(e){
  var f = e.target.closest('form[data-gform]');
  if(!f) return;
  e.preventDefault();
  var it = {t:f.dataset.gform}, ok = true;
  Array.prototype.forEach.call(f.querySelectorAll('input[name]'), function(el){
    var v = el.value.trim();
    if(!v) ok = false;
    it[el.name] = el.type==='number' ? Number(v) : v;
  });
  if(!ok) return;
  if(app.mode==='guest') app.msg = '';
  app.armed = '';
  act(it);
  Array.prototype.forEach.call(f.querySelectorAll('input[name]'), function(el){ el.value = ''; });
});
document.addEventListener('input', function(e){
  if(e.target.id==='my-name') app.name = e.target.value;
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Enter' || app.screen!=='home') return;
  if(e.target.id==='room-code'){ e.preventDefault(); joinRoom(e.target.value); }
  else if(e.target.id==='my-name' && app.invite){ e.preventDefault(); joinRoom(app.invite); }
});
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && app.screen==='room') keepAwake();
});

function boot(){
  var n = load('nj-name');
  if(typeof n!=='string') n = load('pe-name');
  if(typeof n==='string') app.name = n;
  var pc = parseCode((location.hash||'').slice(1));
  if(pc){
    var hs = load('nj-host'), gs = load('nj-guest');
    if(hs && hs.code===pc.code && hs.S && Date.now()-hs.at < 6*3600e3) return resumeHost(hs);
    if(gs && gs.code===pc.code && gs.name && Date.now()-gs.at < 6*3600e3){ app.name = gs.name; return joinRoom(pc.code); }
    app.invite = pc.code;
  }
  render();
}

  nextRound:function(G){
    G.round++;
    if(G.round>=G.queue.length){ G.over = true; return; }
    G.guesses = {}; G.res = null; G.phase = 'guess';
  },
  allIn:function(G){ return G.order.length>0 && G.order.every(function(p){ return G.guesses[p]!==undefined; }); },
  reveal:function(G){
    var ans = LM_BANK[G.queue[G.round]][1], best = -1;
    G.order.forEach(function(p){ var v = G.guesses[p]; if(v!==undefined && v<=ans && v>best) best = v; });
    var winners = best<0 ? [] : G.order.filter(function(p){ return G.guesses[p]===best; });
    winners.forEach(function(p){ addScore(G,p,1); });
    G.res = {ans:ans, guesses:G.guesses, winners:winners};
    G.phase = 'reveal';
  },

    switch(it.t){
      case 'submit':
        if(G.phase==='guess' && Number.isInteger(it.n) && it.n>=0 && it.n<=999999999){
          G.guesses[from] = it.n;
          if(this.allIn(G)) this.reveal(G);
          return true;
        }
        break;
      case 'force': if(host && G.phase==='guess' && Object.keys(G.guesses).length){ this.reveal(G); return true; } break;
      case 'next': if(G.phase==='reveal'){ this.nextRound(G); return true; } break;

  },

    }else if(g.res){

      h += '</ol>';

};
